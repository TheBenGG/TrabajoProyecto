version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:password123@db:5432/appdb
    networks:
      - backend_net
    depends_on:
      - db

  frontend:
    build: ./frontend
    networks:
      - frontend_net

  proxy:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - backend
      - frontend

volumes:
  db_data: